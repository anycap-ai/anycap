# ---------------------------------------------------------------------------
# Pipeline configuration for AnyCap
#
# Branch strategy:
#   main / MR              -> lint + test
#   feat* / fix* / chore* -> lint + test
#   dev/cli                -> nightly CLI build + publish (skill + binary)
#   release/cli-v*         -> goreleaser release (GitLab + GitHub)
#   release/skills-v*      -> sync skills + install.sh to GitHub
#   build/server           -> docker build server only
#   deploy/server-dev      -> docker build + deploy (kntech-dev)
#   deploy/server-prod     -> docker build + deploy (anycap-prod)
# ---------------------------------------------------------------------------

include:
  - project: "engineering/ci"
    ref: "main"
    file: "workflows/go-1.24/.gitlab-ci.yml"

stages:
  - prepare
  - lint
  - test
  - build
  - deploy

# ---------------------------------------------------------------------------
# Extension: build + test
# Runs on main, MRs, and feature/fix/chore branches when extension release inputs change.
# ---------------------------------------------------------------------------

.extension_rules: &extension_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      changes:
        - extension/**/*
        - configs/server/dconf/chrome_extension_launch.*.json
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore)([\/-].+)?$/
      changes:
        - extension/**/*
        - configs/server/dconf/chrome_extension_launch.*.json
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
        - configs/server/dconf/chrome_extension_launch.*.json
    - when: never

build:extension:
  stage: build
  tags:
    - docker
  image: node:22-slim
  <<: *extension_rules
  cache:
    - key:
        files:
          - extension/pnpm-lock.yaml
      paths:
        - extension/node_modules
  script:
    - corepack enable
    - corepack prepare pnpm@10.33.0 --activate
    - cd extension
    - pnpm install --frozen-lockfile
    - pnpm preflight:local
  artifacts:
    paths:
      - extension/.output/
      - extension/releases/
    expire_in: 1 day

variables:
  GOVERSION: "1.25"
  GOTOOLCHAIN: "auto"
  CI_IMAGE: "kntech-registry-vpc.ap-southeast-1.cr.aliyuncs.com/kntech-dev/ci/ci:go-1.24"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  GIT_DEPTH: "20"
  # Docker build config
  APP_server_DOCKERFILE: "deploy/docker/Dockerfile.server"
  APP_server_DOCKER_REPO: "kntech-registry-vpc.ap-southeast-1.cr.aliyuncs.com/kntech-dev/anycap-server"

image: golang:${GOVERSION}

default:
  before_script: []
  cache:
    key:
      files:
        - go.sum
      prefix: "go-1.25"
    paths:
      - .cache/go-mod/
      - .cache/go-build/
    policy: pull-push
  interruptible: true

workflow:
  rules:
    # MR pipelines: lint + test
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # Feature/fix/chore branches: lint + test
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore)([\/-].+)?$/
    # Main branch: lint + test
    - if: $CI_COMMIT_BRANCH == "main"
    # CLI release branches: goreleaser
    - if: $CI_COMMIT_BRANCH =~ /^release\/cli-v[0-9]+\.[0-9]+/
      variables:
        RELEASE_CLI: "true"
    # Skills release branches: sync skills to GitHub
    - if: $CI_COMMIT_BRANCH =~ /^release\/skills-v[0-9]+\.[0-9]+/
      variables:
        RELEASE_SKILLS: "true"
    # Build server image only (no deploy)
    - if: $CI_COMMIT_BRANCH == "build/server"
      variables:
        APPS: "server"
    # Deploy server to dev
    - if: $CI_COMMIT_BRANCH == "deploy/server-dev"
      variables:
        APPS: "server"
        DEPLOY_ENABLED: "true"
        DEPLOY_ENV: "dev"
        APP_server_SAE_APP_NAME: "anycap-server"
        APP_server_SAE_APP_NAMESPACE: "kntech-dev"
    # Dev CLI: nightly CLI build + skill/binary publish
    - if: $CI_COMMIT_BRANCH == "dev/cli"
      variables:
        NIGHTLY: "true"
    # Deploy server to prod
    - if: $CI_COMMIT_BRANCH == "deploy/server-prod"
      variables:
        APPS: "server"
        DEPLOY_ENABLED: "true"
        DEPLOY_ENV: "prod"
        APP_server_SAE_APP_NAME: "anycap-server"
        APP_server_SAE_APP_NAMESPACE: "anycap-prod"

# ---------------------------------------------------------------------------
# Prepare: Build annotate UI (page.html for go:embed)
# Skipped for skills-only releases and server builds (no CLI code needed).
# ---------------------------------------------------------------------------

build:annotate-ui:
  stage: prepare
  tags:
    - docker
  image: node:22-slim
  cache:
    key:
      files:
        - internal/cli/annotate/web/package-lock.json
      prefix: "npm-annotate"
    paths:
      - .cache/npm/annotate/
    policy: pull-push
  script:
    - cd internal/cli/annotate/web
    - npm ci --cache "$NPM_CONFIG_CACHE/annotate" --prefer-offline
    - npm run build
    - cp dist/index.html ../page.html
  artifacts:
    paths:
      - internal/cli/annotate/page.html
    expire_in: 1 day
  rules:
    - if: $RELEASE_SKILLS
      when: never
    - if: $APPS
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Prepare: Build draw UI (page.html for go:embed)
# ---------------------------------------------------------------------------

build:draw-ui:
  stage: prepare
  tags:
    - docker
  image: node:22-slim
  cache:
    key:
      files:
        - internal/cli/draw/web/package-lock.json
      prefix: "npm-draw"
    paths:
      - .cache/npm/draw/
    policy: pull-push
  script:
    - cd internal/cli/draw/web
    - npm ci --cache "$NPM_CONFIG_CACHE/draw" --prefer-offline
    - npm run build
    - cp dist/index.html ../page.html
  artifacts:
    paths:
      - internal/cli/draw/page.html
    expire_in: 1 day
  rules:
    - if: $RELEASE_SKILLS
      when: never
    - if: $APPS
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Lint (skip on release, build, deploy, nightly branches)
# ---------------------------------------------------------------------------

lint:
  stage: lint
  tags:
    - docker
  needs:
    - job: build:annotate-ui
      artifacts: true
    - job: build:draw-ui
      artifacts: true
  script:
    - go vet ./...
  rules:
    - if: $RELEASE_CLI
      when: never
    - if: $RELEASE_SKILLS
      when: never
    - if: $APPS
      when: never
    - if: $NIGHTLY
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Test (skip on release, build, deploy, nightly branches)
# ---------------------------------------------------------------------------

test:
  stage: test
  tags:
    - docker
  needs:
    - job: build:annotate-ui
      artifacts: true
    - job: build:draw-ui
      artifacts: true
  script:
    - go test -vet=off ./...
  rules:
    - if: $RELEASE_CLI
      when: never
    - if: $RELEASE_SKILLS
      when: never
    - if: $APPS
      when: never
    - if: $NIGHTLY
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Build: Docker image (from engineering/ci include)
# Runs on build/* and deploy/* branches (when APPS is set)
# ---------------------------------------------------------------------------

build:image:
  image: $CI_IMAGE
  rules:
    # Main branch: run the server image build after merge.
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APPS: "server"
    - if: $APPS

# ---------------------------------------------------------------------------
# Deploy: SAE (from engineering/ci include)
# Only on deploy branches (DEPLOY_ENABLED=true)
# ---------------------------------------------------------------------------

deploy:dev:
  image: $CI_IMAGE

# ---------------------------------------------------------------------------
# Build: CLI dev binaries (goreleaser snapshot, on dev/cli)
#
# Produces cross-compiled binaries with DefaultEndpoint pointing to dev server.
# ---------------------------------------------------------------------------

build:cli:dev:
  stage: build
  tags:
    - docker
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  needs:
    - job: build:annotate-ui
      artifacts: true
    - job: build:draw-ui
      artifacts: true
  variables:
    GIT_DEPTH: 0
    CLI_DEFAULT_ENDPOINT: "https://anycap-server.dev.knoffice.tech"
  script:
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      goreleaser release --clean --snapshot
      # Flatten: keep macOS + linux binaries
      find dist -name "anycap" -path "*darwin_amd64*" -exec cp {} anycap-darwin-amd64 \;
      find dist -name "anycap" -path "*darwin_arm64*" -exec cp {} anycap-darwin-arm64 \;
      find dist -name "anycap" -path "*linux_amd64*" -exec cp {} anycap-linux-amd64 \;
  artifacts:
    paths:
      - anycap-darwin-amd64
      - anycap-darwin-arm64
      - anycap-linux-amd64
    expire_in: 1 day
  rules:
    - if: '$NIGHTLY == "true"'

# ---------------------------------------------------------------------------
# Publish: Nightly CLI + skills to NexusHub (on dev/cli)
#
# Bundles linux-amd64 binary into anycap-cli skill, then publishes ALL
# skill directories under skills/ to BOTH NexusHub environments
# (dev + prod) under their canonical name. dev/cli is treated as the
# rolling source of truth for both NexusHub instances; release/cli-v*
# and release/skills-v* only publish to GitHub (binaries, npm, skill
# source-of-truth), not to NexusHub.
#
# Note: the embedded binary uses the dev DefaultEndpoint, so consumers
# of either NexusHub instance hit the dev anycap-server by design
# (pre-prod canary semantics).
#
# Required CI variables (Settings > CI/CD > Variables, protected on dev/cli):
#   NEXUSHUB_DEV_BASE_URL       - dev NexusHub Platform API URL
#   NEXUSHUB_DEV_API_TOKEN      - dev NexusHub bearer token
#   NEXUSHUB_PROD_BASE_URL      - prod NexusHub Platform API URL
#   NEXUSHUB_PROD_API_TOKEN     - prod NexusHub bearer token
#
# Also requires: project 138 allows CI_JOB_TOKEN from this project
#                (Settings > CI/CD > Job token permissions)
# ---------------------------------------------------------------------------

publish:nightly:
  stage: deploy
  tags:
    - docker
  image: python:3.13-slim
  needs:
    - job: build:cli:dev
      artifacts: true
  before_script:
    - pip install --quiet nexushub-client --extra-index-url "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.knoffice.tech/api/v4/projects/138/packages/pypi/simple"
  script:
    - |
      set -eu
      # Bundle linux-amd64 binary into anycap-cli skill (shipped with binary)
      mkdir -p skills/anycap-cli/bin
      cp anycap-linux-amd64 skills/anycap-cli/bin/anycap
      chmod +x skills/anycap-cli/bin/anycap

      # Publish each skill to both dev and prod NexusHub instances under
      # the canonical name. delete+upload forces a fresh commit hash so
      # agent platform cache (keyed by commit hash) is invalidated.
      publish_to_target() {
        local target_name="$1"
        export NEXUSHUB_BASE_URL="$2"
        export NEXUSHUB_API_TOKEN="$3"
        echo "=== Target: ${target_name} (${NEXUSHUB_BASE_URL}) ==="
        for skill_dir in skills/*/; do
          skill_name=$(basename "$skill_dir")
          echo "  Publishing ${skill_name} from ${skill_dir} ..."
          nexushub-cli delete "$skill_name" -y || true
          nexushub-cli upload "$skill_dir" -k "$skill_name" --author "AnyCap Nightly"
        done
      }

      publish_to_target "dev"  "${NEXUSHUB_DEV_BASE_URL}"  "${NEXUSHUB_DEV_API_TOKEN}"
      publish_to_target "prod" "${NEXUSHUB_PROD_BASE_URL}" "${NEXUSHUB_PROD_API_TOKEN}"
  rules:
    - if: '$NIGHTLY == "true"'

# ---------------------------------------------------------------------------
# Build: CLI binaries (goreleaser, no publish)
#
# Trigger: push branch release/cli-v<semver>
# Example: release/cli-v0.1.0, release/cli-v1.2.3-rc.1
# ---------------------------------------------------------------------------

build:cli:
  stage: build
  tags:
    - docker
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  needs:
    - job: build:annotate-ui
      artifacts: true
    - job: build:draw-ui
      artifacts: true
  variables:
    GIT_DEPTH: 0
  script:
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/cli-||')
      echo "Building ${TAG} ..."
      git tag "${TAG}"
      goreleaser release --clean --skip=publish
  artifacts:
    # Only forward archives + checksums to release:github. The raw
    # per-platform binary directories under dist/ (anycap_<os>_<arch>/anycap)
    # are large (UI assets are embedded) and uploading the whole dist/
    # tripped the GitLab coordinator's request size limit (HTTP 413).
    paths:
      - dist/anycap_*.tar.gz
      - dist/anycap_*.zip
      - dist/checksums.txt
    expire_in: 1 day
  rules:
    - if: '$RELEASE_CLI == "true"'

# ---------------------------------------------------------------------------
# Release: GitHub (upload CLI artifacts as GitHub Release)
# ---------------------------------------------------------------------------

release:github:
  stage: deploy
  tags:
    - docker
  image: alpine:3.20
  needs:
    - job: build:cli
      artifacts: true
  before_script:
    - apk add --no-cache curl jq openssl
  script:
    - |
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/cli-||')
      export RELEASE_TAG="${TAG}"
      sh scripts/release/github-release.sh
  rules:
    - if: '$RELEASE_CLI == "true"'

# ---------------------------------------------------------------------------
# Sync: Skills + install.sh to GitHub repo (independent of CLI release)
#
# Trigger: push branch release/skills-v<semver>
# Example: release/skills-v0.1.0
#
# Syncs skills/ directory and install.sh to the GitHub repo, updating
# the version in all SKILL.md files. Can be re-pushed after a CLI release
# to update skills without rebuilding the CLI.
# ---------------------------------------------------------------------------

sync:skills:
  stage: deploy
  tags:
    - docker
  image: alpine:3.20
  needs: []
  before_script:
    - apk add --no-cache git sed curl jq openssl
  script:
    - |
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/skills-||')
      export RELEASE_TAG="${TAG}"
      sh scripts/release/sync-skills.sh
  rules:
    - if: '$RELEASE_SKILLS == "true"'
