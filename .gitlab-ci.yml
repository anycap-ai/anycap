# ---------------------------------------------------------------------------
# Pipeline configuration for AnyCap
#
# Branch strategy:
#   main / MR              -> lint + test
#   feat* / fix* / chore* -> lint + test
#   dev/cli                -> lint + test + nightly CLI build + publish (skill + binary)
#   release/cli-v*         -> goreleaser release (GitLab + GitHub)
#   build/server           -> docker build server only
#   deploy/server-dev      -> docker build + deploy (kntech-dev)
#   deploy/server-prod     -> docker build + deploy (infra-prod)
# ---------------------------------------------------------------------------

include:
  - project: "engineering/ci"
    ref: "main"
    file: "workflows/go-1.24/.gitlab-ci.yml"

stages:
  - lint
  - test
  - build
  - deploy

variables:
  GOVERSION: "1.25"
  GOTOOLCHAIN: "auto"
  CI_IMAGE: "kntech-registry-vpc.ap-southeast-1.cr.aliyuncs.com/kntech-dev/ci/ci:go-1.24"
  # Docker build config
  APP_server_DOCKERFILE: "deploy/docker/Dockerfile.server"
  APP_server_DOCKER_REPO: "kntech-registry-vpc.ap-southeast-1.cr.aliyuncs.com/kntech-dev/anycap-server"

image: golang:${GOVERSION}

default:
  before_script: []
  cache: []
  interruptible: true

workflow:
  rules:
    # MR pipelines: lint + test
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # Feature/fix/chore branches: lint + test
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore)([\/-].+)?$/
    # Main branch: lint + test
    - if: $CI_COMMIT_BRANCH == "main"
    # CLI release branches: goreleaser
    - if: $CI_COMMIT_BRANCH =~ /^release\/cli-v[0-9]+\.[0-9]+/
      variables:
        RELEASE_CLI: "true"
    # Build server image only (no deploy)
    - if: $CI_COMMIT_BRANCH == "build/server"
      variables:
        APPS: "server"
    # Deploy server to dev
    - if: $CI_COMMIT_BRANCH == "deploy/server-dev"
      variables:
        APPS: "server"
        DEPLOY_ENABLED: "true"
        DEPLOY_ENV: "dev"
        APP_server_SAE_APP_NAME: "anycap-server"
        APP_server_SAE_APP_NAMESPACE: "kntech-dev"
    # Dev CLI: nightly CLI build + skill/binary publish
    - if: $CI_COMMIT_BRANCH == "dev/cli"
      variables:
        NIGHTLY: "true"
    # Deploy server to prod
    - if: $CI_COMMIT_BRANCH == "deploy/server-prod"
      variables:
        APPS: "server"
        DEPLOY_ENABLED: "true"
        DEPLOY_ENV: "prod"
        APP_server_SAE_APP_NAME: "anycap-server"
        APP_server_SAE_APP_NAMESPACE: "infra-prod"

# ---------------------------------------------------------------------------
# Lint (skip on release, build, deploy branches)
# ---------------------------------------------------------------------------

lint:
  stage: lint
  tags:
    - docker
  script:
    - go vet ./...
  rules:
    - if: $RELEASE_CLI
      when: never
    - if: $APPS
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Test (skip on release, build, deploy branches)
# ---------------------------------------------------------------------------

test:
  stage: test
  tags:
    - docker
  script:
    - go test ./...
  rules:
    - if: $RELEASE_CLI
      when: never
    - if: $APPS
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Build: Docker image (from engineering/ci include)
# Runs on build/* and deploy/* branches (when APPS is set)
# ---------------------------------------------------------------------------

build:image:
  image: $CI_IMAGE
  rules:
    - if: $APPS

# ---------------------------------------------------------------------------
# Deploy: SAE (from engineering/ci include)
# Only on deploy branches (DEPLOY_ENABLED=true)
# ---------------------------------------------------------------------------

deploy:dev:
  image: $CI_IMAGE

# ---------------------------------------------------------------------------
# Build: CLI dev binaries (goreleaser snapshot, on dev/cli)
#
# Produces cross-compiled binaries with DefaultEndpoint pointing to dev server.
# ---------------------------------------------------------------------------

build:cli:dev:
  stage: build
  tags:
    - docker
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    CLI_DEFAULT_ENDPOINT: "https://anycap-server.dev.knoffice.tech"
  script:
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      goreleaser release --clean --snapshot
      # Flatten: keep macOS + linux binaries
      find dist -name "anycap" -path "*darwin_amd64*" -exec cp {} anycap-darwin-amd64 \;
      find dist -name "anycap" -path "*darwin_arm64*" -exec cp {} anycap-darwin-arm64 \;
      find dist -name "anycap" -path "*linux_amd64*" -exec cp {} anycap-linux-amd64 \;
  artifacts:
    paths:
      - anycap-darwin-amd64
      - anycap-darwin-arm64
      - anycap-linux-amd64
    expire_in: 1 day
  rules:
    - if: '$NIGHTLY == "true"'

# ---------------------------------------------------------------------------
# Publish: Nightly CLI + skill to NexusHub (on dev/cli)
#
# Bundles linux-amd64 binary into skill directory and publishes as
# anycap-cli-nightly. Production skill (anycap-cli) is NOT affected.
# Requires CI variables: NEXUSHUB_BASE_URL, NEXUSHUB_API_TOKEN
# Requires: project 138 allows CI_JOB_TOKEN from this project
#           (Settings > CI/CD > Job token permissions)
# ---------------------------------------------------------------------------

publish:nightly:
  stage: deploy
  tags:
    - docker
  image: python:3.12-slim
  needs:
    - job: build:cli:dev
      artifacts: true
  before_script:
    - pip install --quiet nexushub-client
        --extra-index-url "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.knoffice.tech/api/v4/projects/138/packages/pypi/simple"
  script:
    - |
      # Bundle linux-amd64 binary into skill directory
      mkdir -p skills/anycap-cli/bin
      cp anycap-linux-amd64 skills/anycap-cli/bin/anycap
      chmod +x skills/anycap-cli/bin/anycap
      # Publish as nightly (separate key, does NOT affect production anycap-cli)
      nexushub-cli upload skills/anycap-cli -k anycap-cli-nightly --author "AnyCap Nightly"
  rules:
    - if: '$NIGHTLY == "true"'

# ---------------------------------------------------------------------------
# Build: CLI binaries (goreleaser, no publish)
#
# Trigger: push branch release/cli-v<semver>
# Example: release/cli-v0.1.0, release/cli-v1.2.3-rc.1
# ---------------------------------------------------------------------------

build:cli:
  stage: build
  tags:
    - docker
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/cli-||')
      echo "Building ${TAG} ..."
      git tag "${TAG}"
      goreleaser release --clean --skip=publish
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: '$RELEASE_CLI == "true"'

# ---------------------------------------------------------------------------
# Sync: Skills + install.sh to GitHub repo (runs BEFORE release)
# ---------------------------------------------------------------------------

sync:skills:
  stage: deploy
  tags:
    - docker
  image: alpine:3.20
  needs:
    - job: build:cli
  before_script:
    - apk add --no-cache git sed curl jq openssl
  script:
    - |
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/cli-||')
      export RELEASE_TAG="${TAG}"
      sh scripts/release/sync-skills.sh
  rules:
    - if: '$RELEASE_CLI == "true"'

# ---------------------------------------------------------------------------
# Release: GitHub (runs AFTER sync so install.sh is available)
# ---------------------------------------------------------------------------

release:github:
  stage: deploy
  tags:
    - docker
  image: alpine:3.20
  needs:
    - job: build:cli
      artifacts: true
    - job: sync:skills
  before_script:
    - apk add --no-cache curl jq openssl
  script:
    - |
      TAG=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/cli-||')
      export RELEASE_TAG="${TAG}"
      sh scripts/release/github-release.sh
  rules:
    - if: '$RELEASE_CLI == "true"'
