<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f9faf5">
  <title>Page not found | AnyCap Docs</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1c1f17;background:#f9faf5}
    body{margin:0;background:radial-gradient(circle at 78% 6%,#edf0df,transparent 32rem);min-height:100vh}
    main{max-width:48rem;margin:0 auto;padding:12vh 2rem}
    .eyebrow{color:#6b7d3a;font:700 .9rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}
    h1{margin:.5rem 0 1.5rem;font:700 clamp(2.8rem,9vw,6rem)/.98 ui-monospace,monospace;letter-spacing:-.07em}
    p{max-width:38rem;font-size:1.1rem;line-height:1.7;color:#596052}
    a{display:inline-block;margin-top:1rem;border-radius:.45rem;background:#6b7d3a;padding:.8rem 1.1rem;color:#fffffc;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid #1c1f17;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Capability not found.</h1>
    <p>The page may have moved. Return to the documentation overview or use search to find the workflow you need.</p>
    <a href="/">Back to AnyCap Docs</a>
  </main>
</body>
</html>
