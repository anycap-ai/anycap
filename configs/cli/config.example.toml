# AnyCap CLI configuration
# Location: ~/.anycap/config.toml

# Server endpoint (overridden by --endpoint flag or ANYCAP_API_ENDPOINT env)
endpoint = "http://127.0.0.1:18080"

# Automatically check and update CLI binary from GitHub Releases (default: true)
auto_update = true

# Enable the feedback command for submitting bug reports and feature requests (default: true)
feedback = true
