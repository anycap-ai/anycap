version: 2

project_name: anycap

builds:
  - id: anycap
    binary: anycap
    main: ./cmd/anycap
    env:
      - CGO_ENABLED=0
    hooks:
      pre: sh -c "rm -rf internal/cli/skill/embedded/anycap-cli && mkdir -p internal/cli/skill/embedded/anycap-cli/references && cp skills/anycap-cli/SKILL.md internal/cli/skill/embedded/anycap-cli/ && cp skills/anycap-cli/references/*.md internal/cli/skill/embedded/anycap-cli/references/"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Version={{.Version}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Commit={{.FullCommit}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Date={{.Date}}

archives:
  - id: anycap
    ids:
      - anycap
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "anycap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

