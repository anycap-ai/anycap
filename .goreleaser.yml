version: 2

project_name: anycap

before:
  hooks:
    # annotate-ui (page.html) is built by CI and passed as artifact — not built here.
    - sh -c "rm -rf internal/cli/skill/embedded/anycap-cli && mkdir -p internal/cli/skill/embedded/anycap-cli/references && cp skills/anycap-cli/SKILL.md internal/cli/skill/embedded/anycap-cli/ && cp skills/anycap-cli/references/*.md internal/cli/skill/embedded/anycap-cli/references/"

builds:
  - id: anycap
    binary: anycap
    main: ./cmd/anycap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Version={{.Version}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Commit={{.FullCommit}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Date={{.Date}}
      - -X gitlab.knoffice.tech/engineering/anycap/internal/cli/config.DefaultEndpoint={{ if index .Env "CLI_DEFAULT_ENDPOINT" }}{{ .Env.CLI_DEFAULT_ENDPOINT }}{{ else }}https://api.anycap.ai{{ end }}

archives:
  - id: anycap
    ids:
      - anycap
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "anycap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

snapshot:
  version_template: "nightly"

