version: 2

project_name: anycap

gitlab_urls:
  api: https://gitlab.knoffice.tech/api/v4/
  download: https://gitlab.knoffice.tech/

builds:
  - id: anycap
    binary: anycap
    main: ./cmd/anycap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Version={{.Version}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Commit={{.FullCommit}}
      - -X gitlab.knoffice.tech/engineering/anycap/pkg/buildinfo.Date={{.Date}}

archives:
  - id: anycap
    builds:
      - anycap
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "anycap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  gitlab:
    owner: engineering
    name: anycap
