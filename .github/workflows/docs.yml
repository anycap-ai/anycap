name: Docs

on:
  pull_request:
    paths:
      - "assets/**"
      - "docs/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "docs/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Check docs
        working-directory: docs
        run: npm run check

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - name: Audit SEO and internal links
        working-directory: docs
        run: npm run audit:build

      - name: Verify release artifact
        run: |
          set -euo pipefail
          test -f docs/dist/index.html
          test -f docs/dist/robots.txt
          test -f docs/dist/sitemap-index.xml
          test -f docs/dist/llms.txt
          test -f docs/dist/_headers
          test -f docs/dist/_redirects

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    environment:
      name: docs
      url: https://docs.anyware.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deployment dependencies
        working-directory: docs
        run: npm ci

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs/dist

      - name: Create or update Cloudflare Worker
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
