name: Publish npm

# Synced to the public GitHub repository by scripts/release/sync-skills.sh.
# Triggered when GitLab CI publishes a GitHub Release, or manually.
# Uses npm OIDC trusted publishing; no npm token is stored in this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.1)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  publish-platform:
    name: "npm: @anycap/cli-${{ matrix.npm_suffix }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { go_os: darwin,  go_arch: amd64, npm_suffix: darwin-x64,   npm_os: darwin, npm_cpu: x64,   ext: tar.gz }
          - { go_os: darwin,  go_arch: arm64, npm_suffix: darwin-arm64, npm_os: darwin, npm_cpu: arm64, ext: tar.gz }
          - { go_os: linux,   go_arch: amd64, npm_suffix: linux-x64,   npm_os: linux,  npm_cpu: x64,   ext: tar.gz }
          - { go_os: linux,   go_arch: arm64, npm_suffix: linux-arm64, npm_os: linux,  npm_cpu: arm64, ext: tar.gz }
          - { go_os: windows, go_arch: amd64, npm_suffix: win32-x64,   npm_os: win32, npm_cpu: x64,   ext: zip }
          - { go_os: windows, go_arch: arm64, npm_suffix: win32-arm64, npm_os: win32, npm_cpu: arm64, ext: zip }
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="anycap_${VERSION}_${{ matrix.go_os }}_${{ matrix.go_arch }}.${{ matrix.ext }}"
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "${ARCHIVE}" \
            --dir .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          BIN_NAME="anycap"
          if [ "${{ matrix.go_os }}" = "windows" ]; then
            BIN_NAME="anycap.exe"
          fi

          mkdir -p pkg/bin
          if [ "${{ matrix.ext }}" = "zip" ]; then
            unzip -o -j "${ARCHIVE}" "${BIN_NAME}" -d pkg/bin/
          else
            tar -xzf "${ARCHIVE}" -C pkg/bin/ "${BIN_NAME}"
          fi
          chmod +x "pkg/bin/${BIN_NAME}"

          PKG_NAME="@anycap/cli-${{ matrix.npm_suffix }}"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('pkg/package.json', JSON.stringify({
              name: '${PKG_NAME}',
              version: '${VERSION}',
              description: 'AnyCap CLI binary for ${{ matrix.npm_os }}-${{ matrix.npm_cpu }}',
              license: 'MIT',
              repository: { type: 'git', url: 'https://github.com/${{ github.repository }}' },
              os: ['${{ matrix.npm_os }}'],
              cpu: ['${{ matrix.npm_cpu }}'],
              files: ['bin/']
            }, null, 2) + '\n');
          "

      - name: Publish platform package
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          PKG_VERSION=$(node -p "require('./pkg/package.json').version")

          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -q "${PKG_VERSION}"; then
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping."
            exit 0
          fi

          MAX_RETRIES=3
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if npm publish pkg/ --provenance --access public; then
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              sleep 15
            fi
          done

          npm publish pkg/ --access public

  publish-main:
    name: "npm: @anycap/cli"
    needs: [publish-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify all platform packages exist
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PLATFORMS=(darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64)
          MISSING=0

          for platform in "${PLATFORMS[@]}"; do
            PACKAGE="@anycap/cli-${platform}@${VERSION}"
            if ! npm view "${PACKAGE}" version 2>/dev/null | grep -q "${VERSION}"; then
              echo "Missing ${PACKAGE}"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: ${MISSING} platform package(s) missing from npm."
            exit 1
          fi

      - name: Render and validate main package
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          node scripts/release/render-npm-main-package.js npm/anycap pkg "${VERSION}"
          node scripts/release/validate-mcp-manifest.js pkg/server.json pkg/package.json

          PACK_RESULT=$(npm pack pkg/ --dry-run --json)
          printf '%s' "$PACK_RESULT" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const files = JSON.parse(input)[0].files.map(file => file.path);
              for (const required of ["bin/anycap", "server.json"]) {
                if (!files.includes(required)) {
                  throw new Error(`npm tarball missing ${required}`);
                }
              }
            });
          '

      - name: Publish main package
        run: npm publish pkg/ --provenance --access public
